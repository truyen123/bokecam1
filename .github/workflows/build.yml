name: Build BokeCam DEB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build package (roothide)
    # macOS ships the real Apple clang + Xcode SDK, so no cross toolchain
    # download and no apt packages are needed.
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the Theos project directory
        id: project
        run: |
          if [ -f "Makefile" ] && [ -f "Tweak.xm" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "bokecam/Makefile" ] && [ -f "bokecam/Tweak.xm" ]; then
            echo "dir=bokecam" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find Makefile and Tweak.xm in the repository."
            exit 1
          fi

      - name: Install build tools
        run: |
          brew install ldid dpkg make xz
          # Put GNU make 4.x first in PATH (macOS ships make 3.81).
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install RootHide Theos
        # roothide/theos contains the `roothide` package scheme, the upstream
        # theos/theos does not.
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks-tmp"
          mkdir -p "$THEOS/sdks"
          cp -R "$THEOS/sdks-tmp/"*.sdk "$THEOS/sdks/"
          rm -rf "$THEOS/sdks-tmp"
          echo "--- installed SDKs ---"
          ls -1 "$THEOS/sdks"

      - name: Build package
        run: |
          cd "${{ steps.project.outputs.dir }}"
          make --version | head -n 1
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BokeCam-deb
          path: ${{ steps.project.outputs.dir }}/packages/*.deb
          if-no-files-found: error

      - name: Package contents preview
        run: |
          cd "${{ steps.project.outputs.dir }}"
          for deb in packages/*.deb; do
            echo "===== $deb ====="
            dpkg-deb -I "$deb" || true
            dpkg-deb -c "$deb" || true
          done
