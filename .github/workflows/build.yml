name: Build BokeCam DEB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build package (roothide)
    runs-on: ubuntu-latest

    env:
      THEOS: /opt/theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate the Theos project directory
        id: project
        run: |
          # The Theos project can either sit in the repository root or in a
          # "bokecam" sub directory. Detect it automatically.
          if [ -f "Makefile" ] && [ -f "Tweak.xm" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "bokecam/Makefile" ] && [ -f "bokecam/Tweak.xm" ]; then
            echo "dir=bokecam" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find Makefile and Tweak.xm in the repository."
            exit 1
          fi
          echo "Theos project directory: ${{ steps.project.outputs.dir }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            fakeroot \
            git \
            libxml2 \
            lzma \
            make \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          sudo chown -R "$(whoami)" "$THEOS"
          echo "Theos installed at $THEOS"

      - name: Install Theos iOS toolchain
        # The cross compiler lives in $THEOS/toolchain/linux/iphone/bin.
        # Without it the build fails with "clang: No such file or directory".
        # This is the exact same prebuilt archive that the official
        # $THEOS/bin/install-theos script downloads on Linux.
        run: |
          set -e
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  TOOLCHAIN_ARCH="x86_64" ;;
            aarch64) TOOLCHAIN_ARCH="aarch64" ;;
            *)
              echo "::error::Unsupported build architecture: $ARCH"
              exit 1
              ;;
          esac

          echo "Downloading prebuilt iOS toolchain for $TOOLCHAIN_ARCH ..."
          curl -fL --retry 3 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${TOOLCHAIN_ARCH}.tar.xz" \
            -o /tmp/toolchain.tar.xz

          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain/"
          rm -f /tmp/toolchain.tar.xz

          sudo chown -R "$(whoami)" "$THEOS"

      - name: Verify toolchain
        run: |
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          if [ ! -x "$CLANG" ]; then
            echo "::error::Theos toolchain clang is missing at $CLANG"
            echo "::error::Contents of $THEOS/toolchain:"
            find "$THEOS/toolchain" -maxdepth 3 -type d | head -n 30
            exit 1
          fi
          "$CLANG" --version

      - name: Install iOS SDK
        run: |
          # bin/install-sdk downloads the patched SDKs used by every target.
          "$THEOS/bin/install-sdk" latest
          echo "--- installed SDKs ---"
          ls -1 "$THEOS/sdks"
          if ! ls "$THEOS/sdks" | grep -q "iPhoneOS"; then
            echo "::error::No iPhoneOS SDK was installed."
            exit 1
          fi

      - name: Show build environment
        run: |
          echo "Theos version: $(git -C "$THEOS" log -1 --oneline)"
          echo "Scheme: $THEOS_PACKAGE_SCHEME"

      - name: Build package
        run: |
          cd "${{ steps.project.outputs.dir }}"
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BokeCam-deb
          path: |
            ${{ steps.project.outputs.dir }}/packages/*.deb
          if-no-files-found: error

      - name: Package contents preview
        run: |
          cd "${{ steps.project.outputs.dir }}"
          for deb in packages/*.deb; do
            echo "===== $deb ====="
            dpkg-deb -I "$deb" || true
            echo "----- files -----"
            dpkg-deb -c "$deb" || true
          done
